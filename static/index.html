<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Remoting Customer Call Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --bg-soft: #f4faf6;
      --ink: #10231a;
      --muted: #5b7166;
      --line: #d7e8de;
      --green: #0d8a4a;
      --green-deep: #086b38;
      --green-soft: #e8f7ee;
      --green-glow: rgba(13, 138, 74, 0.14);
      --danger: #c23b3b;
      --danger-soft: #fdeeee;
      --radius: 18px;
      --shadow: 0 18px 50px rgba(16, 35, 26, 0.06);
      --font: "Figtree", sans-serif;
      --display: "Sora", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
    }

    body {
      background:
        radial-gradient(900px 420px at 12% -10%, rgba(13, 138, 74, 0.12), transparent 60%),
        radial-gradient(700px 380px at 100% 0%, rgba(13, 138, 74, 0.08), transparent 55%),
        linear-gradient(180deg, #ffffff 0%, #f7fcf9 100%);
      background-attachment: fixed;
    }

    .shell {
      width: min(720px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.5rem 0 4rem;
      animation: rise 0.55s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header {
      margin-bottom: 2rem;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 1.1rem;
    }

    .logo {
      width: 2.15rem;
      height: 2.15rem;
      border-radius: 12px;
      background: linear-gradient(145deg, var(--green), var(--green-deep));
      box-shadow: 0 10px 24px var(--green-glow);
      position: relative;
    }

    .logo::after {
      content: "";
      position: absolute;
      inset: 7px;
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      border-top-color: transparent;
      border-left-color: transparent;
      transform: rotate(-20deg);
    }

    .brand-kicker {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--green);
    }

    h1 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(1.65rem, 4vw, 2.15rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      max-width: 14ch;
    }

    .lede {
      margin: 0.75rem 0 0;
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.55;
      max-width: 38ch;
    }

    .panel {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 4px);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .drop {
      position: relative;
      display: grid;
      place-items: center;
      gap: 0.85rem;
      padding: 2.1rem 1.4rem;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
      border-bottom: 1px solid var(--line);
      outline: none;
    }

    .drop:hover,
    .drop:focus-visible,
    .drop.is-drag {
      background: var(--green-soft);
    }

    .drop.is-drag {
      box-shadow: inset 0 0 0 2px var(--green);
    }

    .drop-icon {
      width: 3.2rem;
      height: 3.2rem;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: var(--bg-soft);
      color: var(--green);
      transition: transform 0.25s ease, background 0.2s ease;
    }

    .drop:hover .drop-icon,
    .drop.is-drag .drop-icon {
      transform: translateY(-2px) scale(1.04);
      background: #fff;
    }

    .drop h2 {
      margin: 0;
      font-family: var(--display);
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .drop p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .drop strong {
      color: var(--green-deep);
      font-weight: 600;
    }

    .drop input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.15rem;
      border-bottom: 1px solid var(--line);
      background: #fcfefd;
    }

    .toolbar h3 {
      margin: 0;
      font-family: var(--display);
      font-size: 0.92rem;
      font-weight: 600;
    }

    .count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.6rem;
      height: 1.6rem;
      padding: 0 0.45rem;
      margin-left: 0.4rem;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-deep);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .status {
      min-height: 1.25rem;
      font-size: 0.86rem;
      color: var(--muted);
      transition: color 0.2s ease;
    }

    .status.ok { color: var(--green-deep); }
    .status.err { color: var(--danger); }
    .status.busy { color: var(--ink); }

    .list {
      list-style: none;
      margin: 0;
      padding: 0.35rem 0;
    }

    .list li {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.9rem 1.15rem;
      animation: fadeIn 0.28s ease both;
    }

    .list li + li {
      border-top: 1px solid #eef5f0;
    }

    .file-icon {
      flex: 0 0 auto;
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--green-soft);
      color: var(--green-deep);
    }

    .meta {
      flex: 1;
      min-width: 0;
    }

    .name {
      display: block;
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .size {
      display: block;
      margin-top: 0.15rem;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .delete {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.84rem;
      font-weight: 600;
      padding: 0.45rem 0.75rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .delete:hover,
    .delete:focus-visible {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: #f3c7c7;
      outline: none;
    }

    .empty {
      padding: 2.2rem 1.2rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .empty span {
      display: block;
      margin-top: 0.35rem;
      font-size: 0.84rem;
      opacity: 0.85;
    }

    footer {
      margin-top: 1.25rem;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }

    @media (max-width: 560px) {
      .shell { padding-top: 1.6rem; }
      .toolbar { flex-direction: column; align-items: flex-start; }
      .list li { align-items: flex-start; }
      .delete { margin-left: auto; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand-mark">
        <div class="logo" aria-hidden="true"></div>
        <div class="brand-kicker">Knowledge base</div>
      </div>
      <h1>Remoting.work Customer Call Agent</h1>
      <p class="lede">Add documents for the agent to learn from. Upload to ingest, or remove files you no longer need.</p>
    </header>

    <section class="panel" aria-label="Document manager">
      <label class="drop" id="drop" tabindex="0">
        <div class="drop-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M12 16V4m0 0 4 4m-4-4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 16.5V18a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <h2>Drop a document here</h2>
        <p>or <strong>browse files</strong> · PDF, CSV, TXT and more</p>
        <input id="file" type="file" name="file" />
      </label>

      <div class="toolbar">
        <h3>Library <span class="count" id="count">0</span></h3>
        <p class="status" id="msg" role="status" aria-live="polite"></p>
      </div>

      <ul class="list" id="list"></ul>
    </section>

    <footer>Files are stored in docs and ingested for the call agent.</footer>
  </main>

  <script>
    const msg = document.getElementById("msg");
    const list = document.getElementById("list");
    const count = document.getElementById("count");
    const drop = document.getElementById("drop");
    const fileInput = document.getElementById("file");

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

    function setStatus(text, kind) {
      msg.textContent = text || "";
      msg.className = "status" + (kind ? " " + kind : "");
    }

    function fileIcon() {
      return `<span class="file-icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M7 3.5h7.5L19 8v12.5a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.8"/>
          <path d="M14 3.5V8h5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </span>`;
    }

    async function refresh() {
      const files = await fetch("/api/files").then((r) => r.json());
      count.textContent = String(files.length);

      if (!files.length) {
        list.innerHTML = `<li class="empty">No documents yet<span>Upload your first file to get started</span></li>`;
        return;
      }

      list.innerHTML = files.map((f, i) => `
        <li style="animation-delay:${i * 40}ms">
          ${fileIcon()}
          <div class="meta">
            <span class="name" title="${f.name}">${f.name}</span>
            <span class="size">${formatSize(f.size)}</span>
          </div>
          <button class="delete" type="button" data-name="${f.name}">Remove</button>
        </li>
      `).join("");
    }

    async function upload(file) {
      if (!file) return;
      setStatus("Uploading and ingesting…", "busy");
      const fd = new FormData();
      fd.append("file", file);
      const r = await fetch("/api/files", { method: "POST", body: fd });
      if (r.ok) {
        setStatus("Ingested successfully.", "ok");
      } else {
        setStatus("Upload failed: " + await r.text(), "err");
      }
      fileInput.value = "";
      refresh();
    }

    fileInput.addEventListener("change", () => upload(fileInput.files[0]));

    ["dragenter", "dragover"].forEach((evt) => {
      drop.addEventListener(evt, (e) => {
        e.preventDefault();
        drop.classList.add("is-drag");
      });
    });

    ["dragleave", "drop"].forEach((evt) => {
      drop.addEventListener(evt, (e) => {
        e.preventDefault();
        drop.classList.remove("is-drag");
      });
    });

    drop.addEventListener("drop", (e) => {
      const file = e.dataTransfer.files[0];
      upload(file);
    });

    list.addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-name]");
      if (!btn) return;
      setStatus("Removing…", "busy");
      const r = await fetch("/api/files/" + encodeURIComponent(btn.dataset.name), { method: "DELETE" });
      if (r.ok) {
        setStatus("Removed.", "ok");
      } else {
        setStatus("Delete failed: " + await r.text(), "err");
      }
      refresh();
    });

    refresh();
  </script>
</body>
</html>
